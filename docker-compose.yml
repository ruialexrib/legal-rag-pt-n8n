services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: legal-rag-pt-n8n

    ports:
      - "5678:5678"

    environment:
      - TZ=Europe/Lisbon
      - GENERIC_TIMEZONE=Europe/Lisbon

    volumes:
      - n8n_data:/home/node/.n8n

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  n8n_data: